[package]
name = "nyfe-scope"
version = "0.1.0"
edition = "2024"
description = "Live view of every Claude Code session on your machine, with tmux-based control"
license = "MIT"
repository = "https://github.com/nyfeblade/nyfe-scope"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "monitoring", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "scope"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
