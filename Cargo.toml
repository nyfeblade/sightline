# One engine, several front ends. `core` holds everything that is not a way of
# looking at it: reading transcripts, the session registry, steering a session
# through tmux or a pseudo-console, git worktrees, cost. `tui` is the terminal
# view, `gui` the desktop app; neither is allowed to grow logic the other needs.
[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "crates/gui"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nyfeblade/ironsight"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
portable-pty = "0.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vt100 = "0.16"

[profile.release]
strip = true
