<!-- Sightline. Generated by scripts/make-icon.py; edit that, not this. -->
<svg width="512" height="512" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The band is clipped to the tile rather than drawn to fit it, so the
         angle is a property of the mark and the corners are a property of the
         platform. Changing either does not disturb the other. -->
    <clipPath id="tile">
      <rect width="64" height="64" rx="14.3"/>
    </clipPath>
  </defs>

  <!-- White, and one black diagonal running off both edges.

       Everything else this mark could be was tried: a crosshair, a slab with a
       lit seam, a glass prism refracting a beam, two interlocking solids that
       cannot both be in front. Each was a better drawing than this and a worse
       icon, and the reason is the same every time — they were legible at 512
       and a smudge at 48, which is the size that decides whether a person finds
       the window. An icon is recognised in a dock at a glance, not read.

       So: the one thing the name says, at the largest size it can be said. A
       line of sight, cut across the tile. It survives being shrunk to a
       favicon, it survives being greyed out, and it is the only mark here that
       could be drawn from memory by somebody who has seen it twice. -->
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#FFFFFF"/>
    <polygon points="75.31,-23.82 5.31,97.42 -11.31,87.82 58.69,-33.42" fill="#000000"/>
  </g>
</svg>
