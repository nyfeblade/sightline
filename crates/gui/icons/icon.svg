<!-- Sightline. Generated by scripts/make-icon.py; edit that, not this. -->
<svg width="512" height="512" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1f27"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <!-- The glass itself: white where the light hits it, the accent where it
         falls away. -->
    <linearGradient id="glassFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Its edges, which is where a transparent solid becomes visible at all. -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#E6EDF3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14.3" fill="url(#tile)"/>

  <g transform="translate(32 32) scale(0.84)
                translate(-32 -28)">
    <!-- The beam arriving. -->
    <path d="M 6 42 L 20 34" stroke="#007AFF" stroke-width="3" stroke-linecap="round"/>

    <!-- The solid, and the void inside it. -->
    <path d="M 32 10 L 52 46 L 12 46 Z" fill="url(#glassFace)"
          stroke="url(#glassEdge)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 32 20 L 44 41 L 20 41 Z" fill="#0F1117"
          stroke="url(#glassEdge)" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Inside the glass: offset from the line it came in on, and dimmer,
         because that is what passing through something does to a beam. -->
    <path d="M 20 35.5 L 44 21.5" stroke="#007AFF" stroke-width="2.5"
          stroke-opacity="0.45" stroke-dasharray="2 1"/>

    <!-- The front beam of the figure, laid over the rear face: the overlap is
         what makes the solid impossible. -->
    <path d="M 32 10 L 44 41 L 52 46 L 32 10 Z" fill="url(#glassFace)"
          stroke="url(#glassEdge)" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Out the other side, clean, and where it lands. -->
    <path d="M 44 20 L 58 12" stroke="#007AFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="12" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
