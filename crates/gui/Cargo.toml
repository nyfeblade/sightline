[package]
name = "scope-gui"
description = "Desktop app for watching and steering Claude Code sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scope-gui"
path = "src/main.rs"

[features]
# Embeds the interface in the binary, so a release build needs no dev server
# and no Tauri CLI — the app is one file you can put anywhere.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
# The Windows icon is compiled into the binary by a resource compiler that only
# exists on a Windows host (or with llvm-rc installed), so cross-checking this
# crate from Linux needs one. `cargo check --target x86_64-pc-windows-msvc
# -p scope-core -p nyfe-scope` checks everything that does not.
tauri-build = { version = "2", features = [] }

[dependencies]
scope-core = { path = "../core" }
crossterm.workspace = true
chrono.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
