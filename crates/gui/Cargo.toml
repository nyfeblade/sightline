[package]
name = "scope-gui"
description = "Desktop app for watching and steering Claude Code sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scope-gui"
path = "src/main.rs"

[features]
# Embeds the interface in the binary, so a release build needs no dev server
# and no Tauri CLI — the app is one file you can put anywhere.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scope-core = { path = "../core" }
crossterm.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
