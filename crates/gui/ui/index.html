<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>scope</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Three columns and two bars. What is running, what it is doing, what it
       is — and across the bottom, the one thing that cannot make progress
       without you. -->
  <header class="bar">
    <span class="mark">SCOPE</span>
    <span class="version" id="version">v0.3.0</span>
    <span class="counts" id="counts"></span>
    <span class="grow"></span>
    <button class="ghost" id="cost" title="Requests, or what the same tokens would cost on the API">
      <span id="spend"></span>
    </button>
    <button class="ghost" id="theme" title="Change the accent colour">◐</button>
    <button class="ghost" id="resume">Resume…</button>
    <button class="ghost" id="tui" title="Drive it from a terminal instead">Terminal view</button>
    <button class="primary" id="new">New session</button>
  </header>

  <main>
    <aside class="rail" id="rail">
      <div class="rail-head">
        <span id="agent-count">Sessions</span>
        <button class="icon" id="filter" title="Show only sessions with a process">live</button>
      </div>
      <ol class="agents" id="agents"></ol>
    </aside>

    <section class="middle">
      <nav class="tabs" id="panes">
        <button class="tab is-on" data-pane="feed">Feed</button>
        <button class="tab" data-pane="read">Read</button>
        <button class="tab" data-pane="mirror">Session</button>
        <button class="tab" data-pane="files">Files</button>
        <button class="tab" data-pane="tree">Tree</button>
        <button class="tab" data-pane="plan">Plan</button>
        <button class="tab" data-pane="agents">Subagents</button>
        <button class="tab" data-pane="stats">Stats</button>
        <button class="tab" data-pane="errors">Errors</button>
        <span class="context" id="context"></span>
      </nav>
      <div class="pane" id="pane" tabindex="0"></div>
      <form class="composer" id="composer">
        <input id="message" spellcheck="false" autocomplete="off"
               placeholder="Message this session…" />
        <button class="ghost" id="interrupt" type="button" title="Escape">Interrupt</button>
        <button class="primary send" type="submit">Send</button>
      </form>
    </section>

    <aside class="rail detail" id="detail"></aside>
  </main>

  <section class="ask" id="ask" hidden>
    <span class="warn">◆</span>
    <span class="question"><b id="ask-who"></b><span id="ask-what"></span></span>
    <span class="grow"></span>
    <span class="answers" id="answers"></span>
  </section>

  <footer class="status">
    <span id="note"></span>
    <span class="grow"></span>
    <span class="hint" id="hint"></span>
  </footer>

  <dialog id="starter">
    <form method="dialog" id="start-form">
      <h2>New session</h2>
      <label>Folder<input id="start-path" spellcheck="false" /></label>
      <label>Name<input id="start-name" spellcheck="false" placeholder="asked for, not required" /></label>
      <label>Agent
        <select id="start-agent">
          <option value="claude">Claude Code</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
          <option value="aider">Aider</option>
        </select>
      </label>
      <label>Model<input id="start-model" spellcheck="false" placeholder="whatever it defaults to" /></label>
      <label>First message<input id="start-prompt" spellcheck="false" placeholder="optional" /></label>
      <menu>
        <button value="cancel">Cancel</button>
        <button value="go" class="primary">Start</button>
      </menu>
    </form>
  </dialog>

  <dialog id="colours">
    <h2>Accent</h2>
    <div class="swatches" id="swatches"></div>
    <label>Custom<input type="color" id="custom-accent" /></label>
    <menu><button id="colours-close" class="ghost">Done</button></menu>
  </dialog>

  <dialog id="past">
    <h2>Resume a conversation</h2>
    <input id="past-filter" spellcheck="false" autocomplete="off" placeholder="Filter by name or folder…" />
    <ol class="past-list" id="past-list"></ol>
    <menu><button id="past-close" class="ghost">Close</button></menu>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
