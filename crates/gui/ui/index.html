<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sightline</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Three columns and two bars. What is running, what it is doing, what it
       is — and across the bottom, the one thing that cannot make progress
       without you. -->
  <header class="bar">
    <span class="mark">SIGHTLINE</span>
    <span class="grow"></span>
    <input id="search" class="search" spellcheck="false" autocomplete="off"
           placeholder="Search every session…  /" />
    <button class="ghost" id="resume">Resume…</button>
    <button class="ghost" id="more" title="Everything else">⋯</button>
    <button class="primary" id="new">New session</button>
  </header>

  <main>
    <aside class="rail" id="rail">
      <div class="rail-head">
        <span id="agent-count">Sessions</span>
        <span>
          <button class="icon" id="filter" title="Only sessions with a process">live</button>
          <button class="icon" id="waiting" title="Go to the next session waiting on you">waiting</button>
        </span>
      </div>
      <ol class="agents" id="agents"></ol>
    </aside>

    <section class="middle">
      <nav class="tabs" id="panes">
        <button class="tab is-on" data-pane="talk">Talk</button>
        <button class="tab" data-pane="feed">Feed</button>
        <button class="tab" data-pane="files">Files</button>
        <button class="tab" data-pane="tree">Tree</button>
        <button class="tab" data-pane="plan">Plan</button>
        <button class="tab" data-pane="agents">Subagents</button>
        <button class="tab" data-pane="stats">Stats</button>
        <button class="tab" data-pane="errors">Errors</button>
        <button class="tab" data-pane="stream">Stream</button>
        <button class="tab" data-pane="work">Work</button>
        <button class="tab" data-pane="fleet">Fleet</button>
        <span class="grow"></span>
        <span class="context" id="context"></span>
        <button class="icon" id="focus" title="Fill the window with this session (f)">⤢</button>
      </nav>
      <div class="chips filters" id="filters" hidden></div>
      <div class="pane" id="pane" tabindex="0"></div>
      <form class="composer" id="composer">
        <input id="message" spellcheck="false" autocomplete="off"
               placeholder="Message this session…" />
        <button class="ghost" id="queue" type="button" title="Hold it until this session is idle">Queue</button>
        <button class="ghost" id="interrupt" type="button" title="Escape">Interrupt</button>
        <button class="primary send" type="submit">Send</button>
      </form>
    </section>

    <aside class="rail detail" id="detail"></aside>
  </main>

  <section class="ask" id="ask" hidden>
    <span class="warn">◆</span>
    <span class="question"><b id="ask-who"></b><span id="ask-what"></span></span>
    <span class="grow"></span>
    <span class="answers" id="answers"></span>
  </section>

  <!-- Everything that is a number rather than a control. A status line is where
       measurements belong; the bar at the top is for getting somewhere. -->
  <footer class="status">
    <span id="note"></span>
    <span class="grow"></span>
    <span class="metrics" id="counts"></span>
    <span class="metrics" id="pulse" title="Events on the stream in the last minute, and who is reading it"></span>
    <button class="metrics quiet" id="cost" title="Requests, or what the same tokens would cost on the API">
      <span id="spend"></span>
    </button>
    <span class="hint" id="hint"></span>
  </footer>

  <dialog id="starter">
    <form method="dialog" id="start-form">
      <h2>New session</h2>
      <label>Folder<input id="start-path" spellcheck="false" /></label>
      <label>Name<input id="start-name" spellcheck="false" placeholder="asked for, not required" /></label>
      <label>Agent
        <select id="start-agent">
          <option value="claude">Claude Code</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
          <option value="aider">Aider</option>
        </select>
      </label>
      <label>Model<input id="start-model" spellcheck="false" placeholder="whatever it defaults to" /></label>
      <label>Effort<input id="start-effort" spellcheck="false" placeholder="low · medium · high" /></label>
      <label>Mode<input id="start-mode" spellcheck="false" placeholder="plan · auto" /></label>
      <label>Branch<input id="start-branch" spellcheck="false" placeholder="its own worktree, if named" /></label>
      <label>First message<input id="start-prompt" spellcheck="false" placeholder="optional" /></label>
      <menu>
        <button value="cancel">Cancel</button>
        <button value="go" class="primary">Start</button>
      </menu>
    </form>
  </dialog>

  <dialog id="past">
    <h2>Resume a conversation</h2>
    <input id="past-filter" spellcheck="false" autocomplete="off" placeholder="Filter by name or folder…" />
    <ol class="past-list" id="past-list"></ol>
    <menu><button id="past-close" class="ghost">Close</button></menu>
  </dialog>

  <dialog id="hits">
    <h2 id="hits-title">Matches</h2>
    <ol class="past-list" id="hits-list"></ol>
    <menu><button id="hits-close" class="ghost">Close</button></menu>
  </dialog>

  <dialog id="menu">
    <h2>Everything else</h2>
    <div class="menu-grid" id="menu-grid"></div>
    <div class="group">ACCENT</div>
    <div class="swatches" id="swatches"></div>
    <label class="inline">Custom<input type="color" id="custom-accent" /></label>
    <menu><button id="menu-close" class="ghost">Close</button></menu>
  </dialog>

  <dialog id="code" class="wide">
    <header class="code-head">
      <h2 id="code-title"></h2>
      <span class="grow"></span>
      <span class="code-note" id="code-note"></span>
      <button id="code-close" class="ghost">Close</button>
    </header>
    <div id="code-body" class="code-scroll"></div>
  </dialog>

  <dialog id="detail-text">
    <h2 id="detail-title"></h2>
    <pre id="detail-body"></pre>
    <menu><button id="detail-close" class="ghost">Close</button></menu>
  </dialog>

  <dialog id="writing" class="wide">
    <h2 id="writing-title"></h2>
    <p class="writing-where" id="writing-where"></p>
    <textarea id="writing-body" spellcheck="false"></textarea>
    <menu>
      <button id="writing-cancel" class="ghost">Cancel</button>
      <button id="writing-save" class="primary">Save</button>
    </menu>
  </dialog>

  <dialog id="asking">
    <h2 id="asking-title"></h2>
    <input id="asking-input" spellcheck="false" autocomplete="off" />
    <menu>
      <button id="asking-cancel" class="ghost">Cancel</button>
      <button id="asking-ok" class="primary">OK</button>
    </menu>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
