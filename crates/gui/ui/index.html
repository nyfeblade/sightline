<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>scope</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="bar">
    <span class="mark">SCOPE</span>
    <span class="version" id="version">v0.3.0</span>
    <nav class="tabs" id="views">
      <button class="tab is-on" data-view="fleet">Fleet</button>
      <button class="tab" data-view="sessions">Sessions</button>
      <button class="tab" data-view="registry">Registry</button>
      <button class="tab" data-view="compute">Compute</button>
    </nav>
    <span class="summary" id="summary"></span>
    <span class="spend" id="spend"></span>
    <span class="grow"></span>
    <button class="icon" id="notify" title="Notifications">◔</button>
    <button class="icon" id="tui" title="Open the terminal view">▣</button>
    <button class="primary" id="new">New Session</button>
  </header>

  <main>
    <aside class="rail">
      <div class="rail-head">
        <span id="agent-count">Active Agents</span>
        <button class="icon small" id="filter" title="Only what is running">≡</button>
      </div>
      <ol class="agents" id="agents"></ol>
    </aside>

    <section class="middle">
      <nav class="tabs panes" id="panes">
        <button class="tab is-on" data-pane="feed">Feed</button>
        <button class="tab" data-pane="files">Files</button>
        <button class="tab" data-pane="plan">Plan</button>
        <button class="tab" data-pane="agents">Agents</button>
        <button class="tab" data-pane="mirror">Mirror</button>
        <button class="tab" data-pane="errors">Errors</button>
        <span class="grow"></span>
        <span class="context" id="context"></span>
      </nav>
      <div class="pane" id="pane"></div>
    </section>

    <aside class="rail right">
      <div class="meter">
        <div class="meter-label">CPU Usage</div>
        <div class="meter-value" id="cpu">—</div>
        <div class="track"><i id="cpu-bar"></i></div>
      </div>
      <div class="meter">
        <div class="meter-label">Memory</div>
        <div class="meter-value" id="mem">—</div>
        <div class="track"><i id="mem-bar"></i></div>
      </div>
      <div class="meter-label spaced">Active Tools</div>
      <div class="chips" id="tools"></div>
      <div class="meter-label spaced">Context</div>
      <div class="track"><i id="ctx-bar"></i></div>
      <div class="sub" id="ctx-text"></div>
    </aside>
  </main>

  <footer class="ask" id="ask" hidden>
    <span class="warn">⚠</span>
    <span class="question"><b id="ask-who"></b> <span id="ask-what"></span></span>
    <span class="grow"></span>
    <span class="answers" id="answers"></span>
  </footer>

  <footer class="status">
    <button class="icon" id="settings-foot" title="Settings">⚙ Settings</button>
    <button class="icon" id="docs" title="What the keys do">▤ Docs</button>
    <span id="note"></span>
    <span class="grow"></span>
    <span class="hint" id="hint"></span>
  </footer>

  <dialog id="starter">
    <form method="dialog" id="start-form">
      <h2>New session</h2>
      <label>Folder<input id="start-path" spellcheck="false" /></label>
      <label>Name<input id="start-name" spellcheck="false" placeholder="optional" /></label>
      <label>Agent
        <select id="start-agent">
          <option value="claude">Claude Code</option>
          <option value="codex">Codex</option>
          <option value="gemini">Gemini</option>
          <option value="aider">Aider</option>
        </select>
      </label>
      <label>Model<input id="start-model" spellcheck="false" placeholder="optional" /></label>
      <label>First message<input id="start-prompt" spellcheck="false" placeholder="optional" /></label>
      <menu>
        <button value="cancel" id="start-cancel">Cancel</button>
        <button value="go" id="start-go" class="primary">Start</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
