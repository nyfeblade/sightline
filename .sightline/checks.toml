# What finished means here.
#
# This is the floor, not the finish. Everything below can do is refuse: a suite
# that passes has said that the failures it is able to express did not happen,
# which is worth knowing and is not the same as the work being right. What
# carries a task past "checked" is a refutation — something written to show the
# work is wrong that was tried and did not fire. See `sightline refute`.

[[check]]
name    = "format"
run     = "cargo fmt --check"
timeout = "2m"

[[check]]
name    = "tests"
run     = "cargo test"
timeout = "15m"

# The window's highlighter is JavaScript and `cargo test` cannot see it. Its
# round-trip check is the one that matters: colouring must never change the
# code being read.
[[check]]
name    = "window"
run     = "node crates/gui/ui/tokenize.test.mjs"
timeout = "2m"

# Cross-compiling is how a platform nobody is sitting at stays green.
[[check]]
name     = "windows"
run      = "cargo check --target x86_64-pc-windows-msvc -p sightline-core -p sightline"
timeout  = "10m"
optional = true

# ── invariants ────────────────────────────────────────────────────────────────
#
# The other direction. A check must pass; these must FAIL. Each is written to
# succeed only when the guarantee it names has stopped being true, so a quiet
# run here is the good one and anything that fires is a guarantee that has gone.
#
# They exist because "the tests pass" survives a change that quietly broke
# something load-bearing — which is exactly what happens during a merge, and why
# `sightline glue` hands these to whoever is reconciling a fork. Prose in a
# document cannot fire; a command can.
#
# Each was checked by breaking the thing on purpose and watching it catch it.

[[invariant]]
name   = "core stays synchronous"
must   = "crates/core has no async runtime. Both front ends reach it directly, and making it async makes both async."
refute = "grep -qE '^(tokio|async-std|smol)' crates/core/Cargo.toml"

[[invariant]]
name   = "the event vocabulary is version 1"
must   = "Fields are added, never removed or repurposed; kinds are added, never renamed. Anything else bumps the version, with both emitted for one release."
refute = "! grep -q 'pub const VERSION: u32 = 1;' crates/core/src/bus.rs"

[[invariant]]
name   = "one writer journals"
must   = "A pid-file lock decides who journals. Two processes numbering events from separate counters makes --since meaningless."
refute = "! grep -q 'PublisherLock::acquire' crates/core/src/app.rs"

[[invariant]]
name   = "what leaves is redacted"
must   = "Command lines are masked on the way to the journal and the socket. Not on the way in: the interface still shows the real command."
refute = "! grep -q 'redact::text' crates/core/src/stream.rs"

[[invariant]]
name   = "checks only ever refuse"
must   = "A passing suite reaches Checked, never Verified. Only refutations that have all stood — and have been seen to fire at some point — carry a task past it."
refute = "! grep -q 'stood == refutations.len()' crates/core/src/ladder.rs"

[[invariant]]
name   = "there is one definition of finished"
must   = "Only the ladder runs a refutation. A worker claiming through the kernel tool and a person running `sightline check` must reach the same verdict, so the promotion past Checked has one implementation and both call it."
refute = "grep -rlq 'checks::refute(' crates/tui/src crates/gui/src"

[[invariant]]
name   = "nothing runs from a repository until it is read"
must   = "checks.toml is shell that arrived with someone else's code. It runs only after `sightline trust` approves those exact commands."
refute = "! grep -q 'checks::trusted' crates/tui/src/main.rs"

[[invariant]]
name   = "a ceiling lives outside the worktree"
must   = "The real limits file is in Sightline's data directory. A ceiling a supervised agent can edit is a suggestion."
refute = "! grep -A1 'fn machine_path' crates/core/src/limits.rs | grep -q 'data_dir'"

[[invariant]]
name   = "an owned session's permissions cannot be half-understood"
must   = "owned::Spec is deny_unknown_fields. A daemon that ignored a field it did not know would start a session with the wrong permissions and say nothing."
refute = "! grep -q 'deny_unknown_fields' crates/core/src/owned.rs"

[[invariant]]
name   = "the front ends share one engine"
must   = "Neither front end grows logic the other needs. Sending, answering, starting, reopening: one implementation in core, two callers."
refute = "grep -rlq 'fn pending_approval' crates/tui/src crates/gui/src"

[[invariant]]
name   = "there is one definition of what a chief is"
must   = "Both front ends start a chief through chief::spec. Each used to build owned::Spec itself, and both drifted from the one configuration that had been proved live — losing the kernel tools, the policy, and therefore the whole of supervision, silently."
refute = "! (grep -q 'chief::spec(' crates/core/src/app.rs && grep -q 'chief::spec(' crates/tui/src/main.rs) || grep -rq 'chief::DENIED' crates/tui/src crates/gui/src"
