name: ci

on:
  push:
    branches: [main, master, solidify]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app draws with the system webview. macOS and Windows have
      # one; a Linux runner does not, and without these the workspace will not
      # even configure.
      - name: webview (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: format
        run: cargo fmt --check
      - name: build
        run: cargo build --release
      # The git tests shell out to git and create worktrees in a temp dir; the
      # pty test really starts a session and types into it.
      - name: test
        run: cargo test --release
      # The window's highlighter is JavaScript, so it is not covered by the
      # line above. Its round-trip check is the one that matters: colouring
      # must never change the code being read.
      - name: test (window)
        run: node crates/gui/ui/tokenize.test.mjs
      - name: lint
        run: cargo clippy --release --all-targets
        continue-on-error: true

  # The MSI is WiX 3. WiX 4 (`dotnet tool install wix`) is a different
  # product and will not produce an installer Tauri 2 can use. This job is
  # the thing that makes "Windows has an installer" true rather than a claim.
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'bin' }
          if (-not $wix -or -not (Test-Path (Join-Path $wix 'light.exe'))) {
            throw "WiX 3 light.exe not on this runner — Tauri 2 MSI is WiX 3, not WiX 4"
          }
          echo $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: MSI
        working-directory: crates/gui
        run: cargo tauri build --features custom-protocol --bundles msi
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: sightline-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
