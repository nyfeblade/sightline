name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app draws with the system webview. macOS and Windows have
      # one; a Linux runner does not, and without these the workspace will not
      # even configure.
      - name: webview (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: format
        run: cargo fmt --check
      - name: build
        run: cargo build --release
      # The git tests shell out to git and create worktrees in a temp dir; the
      # pty test really starts a session and types into it.
      - name: test
        run: cargo test --release
      # The window's highlighter is JavaScript, so it is not covered by the
      # line above. Its round-trip check is the one that matters: colouring
      # must never change the code being read.
      - name: test (window)
        run: node crates/gui/ui/tokenize.test.mjs
      - name: lint
        run: cargo clippy --release --all-targets
        continue-on-error: true
