name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Only the terminal view: it needs nothing but a compiler, so the same
      # command works on all three. The Windows app is the MSI job below;
      # Linux's AppImage is the job after that.
      - run: cargo build --release --target ${{ matrix.target }} -p sightline
      - name: package
        if: runner.os != 'Windows'
        run: |
          name="sightline-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/sightline README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "sightline-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sightline.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sightline-*.tar.gz
            sightline-*.zip
          generate_release_notes: true

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # One file holding both front ends: the window when clicked, the terminal
      # view with --tui.
      - name: build the AppImage
        run: scripts/appimage.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage

  # WiX 3, on Windows, because that is what Tauri 2 MSI actually is.
  # Cross-compiling an MSI from Linux is not a thing WiX 3 can do.
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'bin' }
          if (-not $wix -or -not (Test-Path (Join-Path $wix 'light.exe'))) {
            throw "WiX 3 light.exe not on this runner — Tauri 2 MSI is WiX 3, not WiX 4"
          }
          echo $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: MSI
        working-directory: crates/gui
        run: cargo tauri build --features custom-protocol --bundles msi
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/msi/*.msi
