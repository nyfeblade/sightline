name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          name="scope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/scope README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: scope-*.tar.gz
          generate_release_notes: true
